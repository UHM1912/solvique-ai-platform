[project]
name = "solvique-backend"
version = "0.1.0"
description = "Solvique — Enterprise Analytics & Intelligence Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.13.2",
    "langchain[google-genai]>=0.2.0",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=1.0.0",
    "pandas>=2.0.0,<3.0",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.29.0",
    "langchain-google-vertexai>=3.2.2",
    "fastapi>=0.111.0",
    "pydantic>=2.0.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.48",
    "google-genai>=1.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.3.0",
    "prophet>=1.1.0",
    "numpy>=1.24.0",
    "pandas-gbq>=0.34.1",
    "plotly>=6.7.0",
    "langchain-experimental>=0.3.0",
    "tabulate>=0.10.0",
    "kaleido>=0.2.1",
    "reportlab>=3.6.0",
    "python-docx>=1.1.2",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.0",
    "ruff>=0.15.12",
    "psycopg[binary,pool]>=3.2.0,<4.0",
    "google-cloud-storage>=2.18.0,<4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["api", "config", "graph", "main"]

[tool.setuptools.packages.find]
include = ["src*"]
